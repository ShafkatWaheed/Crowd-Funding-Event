name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: event_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r Backend/requirements.txt
      - name: Run migrations
        run: cd Backend && alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/event_db_test
          FIREBASE_PROJECT_ID: test-project
          GOOGLE_APPLICATION_CREDENTIALS: ""
      - name: Run tests
        run: cd Backend && pytest -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/event_db_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/event_db_test
          RATELIMIT_STORAGE_URL: memory://
          FIREBASE_PROJECT_ID: test-project
          GOOGLE_APPLICATION_CREDENTIALS: ""

  analyze-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
      - name: Install dependencies
        run: cd FrontEnd && flutter pub get
      - name: Analyze
        run: cd FrontEnd && dart analyze lib/

  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase credentials
        run: |
          mkdir -p cred
          echo '${{ secrets.FIREBASE_CRED_JSON }}' > cred/cred.json

      - name: Write docker-compose .env
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CRED_PATH=${{ github.workspace }}/cred/cred.json
          TICKET_ENCRYPTION_KEY=${{ secrets.TICKET_ENCRYPTION_KEY }}
          BANK_ENCRYPTION_KEY=${{ secrets.BANK_ENCRYPTION_KEY }}
          CORS_ORIGINS=*
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          API_BASE_URL=${{ secrets.FRONTEND_URL }}
          ENVEOF

      - name: Deploy with Docker Compose
        run: docker compose -f Kub_docker/docker-compose.yml --env-file .env up -d --build
