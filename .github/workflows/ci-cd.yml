name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: event_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r Backend/requirements.txt
      - name: Run tests
        run: cd Backend && pytest -v --tb=short
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/event_db_test
          RATELIMIT_STORAGE_URL: memory://
          FIREBASE_PROJECT_ID: test-project
          GOOGLE_APPLICATION_CREDENTIALS: ""

  analyze-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
      - name: Install dependencies
        run: cd FrontEnd && flutter pub get
      - name: Analyze
        run: cd FrontEnd && dart analyze lib/

  deploy:
    needs: [test-backend, analyze-frontend]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Write backend .env
        run: |
          cat > Backend/.env << 'ENVEOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS=../cred/cred.json
          REDIS_URL=${{ secrets.REDIS_URL }}
          TICKET_ENCRYPTION_KEY=${{ secrets.TICKET_ENCRYPTION_KEY }}
          BANK_ENCRYPTION_KEY=${{ secrets.BANK_ENCRYPTION_KEY }}
          CORS_ORIGINS=*
          ENVEOF

      - name: Write Firebase credentials
        run: echo '${{ secrets.FIREBASE_CRED_JSON }}' > cred/cred.json

      - name: Deploy with Docker Compose
        run: docker compose -f Kub_docker/docker-compose.yml up -d --build
